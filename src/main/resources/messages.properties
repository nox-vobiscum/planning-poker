# Room guide
manual.title=Guide & Features
manual.join.title=Join and invite
manual.join.body=Use the link button beside the room code to copy an invitation. Everyone joins with their own display name. Votes and changes are synchronized automatically for everyone in the room.
manual.vote.title=Estimate and reveal
manual.vote.select=Select a card for your estimate. You can change your selection until the votes are revealed.
manual.vote.hidden=Others can initially see only whether you have voted, not which card you chose.
manual.vote.reveal=The host reveals the votes. After discussing the results, you can start another round if needed.
manual.results.title=Voting status and results
manual.results.status=Symbols in the participant list show whether someone has voted, has not selected a card, is a spectator or is inactive.
manual.results.intro=After reveal, selected cards become visible. For differing numeric estimates, Planning Poker shows:
manual.results.average=Average: the arithmetic mean of the numeric estimates.
manual.results.median=Median: the middle value of the sorted numeric estimates.
manual.results.range=Range: the lowest and highest numeric estimates.
manual.results.outlier=A subtle extra outline may mark estimates furthest from the average. It helps identify different perspectives and does not mean an estimate is wrong.
manual.results.consensus=Planning Poker shows consensus when at least one numeric estimate exists, all numeric estimates agree and no infinity card was played. Other special cards are excluded from this comparison.
manual.cards.title=Decks and special cards
manual.cards.control=The host selects the card sequence and can enable optional special cards.
manual.cards.meaning=Depending on the settings, cards can signal open questions, breaks, dependencies, risks or other topics to discuss.
manual.cards.statistics=Special cards are not numeric estimates and are excluded from average, median and range.
manual.roles.title=Roles and participation
manual.roles.host=The host manages revealing cards, starting new rounds and room settings. Participant actions allow the host to transfer the host role, switch someone to spectator mode or remove them from the room.
manual.roles.spectator=Spectators can follow the session without voting. They can enable participation from their own menu; the host can also change their spectator status.
manual.topic.title=Topic and automatic reveal
manual.topic.body=The host can display an estimation topic with a title and optional ticket link so everyone knows what is being estimated.
manual.topic.autoreveal=When automatic reveal is enabled, cards are revealed once all active participants currently taking part have selected a numeric card. Spectators and inactive participants are excluded; a special card does not trigger automatic reveal.
manual.appearance.title=Language and appearance
manual.appearance.location=You can change the language and appearance at any time. On larger screens, the controls are in the header; on phones, they are in the menu.
manual.appearance.options=Choose English or German, and Light, Dark or System appearance.
manual.exit.title=Leave or close the room
manual.exit.leave=“Leave room” exits only your session. The others can continue.
manual.exit.close=The host can use the separate “Close room for everyone” action to end the room for all participants.

# === About Page ===
about.title=About RBS' Planning Poker
about.heading=Free Online Planning Poker for Agile Teams
about.intro=RBS' Planning Poker is a free, lightweight online planning poker tool designed for agile teams. No registration required, just create a room and start estimating.

about.what.title=What is Planning Poker?
about.what.p1=Planning Poker (also called Scrum Poker or Estimation Poker) helps teams estimate the effort or relative size of tasks together. Everyone chooses an estimate privately, and the cards are then revealed at the same time.
about.what.p2=This reduces the influence of the first number spoken on other estimates. Different estimates make different perspectives visible and give the team useful reasons to discuss the work. The goal is not simply to reach a number quickly, but to build a shared understanding of the task.

about.why.title=Why Use This Tool?
about.why.realtime=Real-time synchronization across all participants
about.why.noreg=No registration or sign-up required
about.why.sequences=Multiple card sequences (Fibonacci, T-Shirt sizes, Powers of 2)
about.why.autoreveal=Manual or automatic reveal
about.why.persistent=Shareable invitation links for quick access
about.why.i18n=Multi-language support (English, German)
about.why.free=Completely free and open for all teams

about.how.title=How to Get Started
about.how.step1=Enter your name and a room code
about.how.step2=Share the invite link with your team
about.how.step3=Choose your estimate from the cards
about.how.step4=The host reveals all cards when ready
about.how.step5=Discuss and re-estimate if needed

about.features.title=Key Features
about.features.websocket=Collaborative estimation in real time without registration
about.features.specials=Multiple card decks and optional special cards
about.features.host=Manual or automatic reveal
about.features.results=Clear results with average, median, range and consensus
about.features.outliers=Highlights for notably different estimates as a discussion aid
about.features.spectator=Host controls and spectator mode
about.features.topic=Estimation topics with an optional ticket link
about.features.themes=English and German with Light, Dark and System appearance
about.features.responsive=Designed for desktop, tablet and smartphone

about.tech.title=Technology
about.tech.p=Built with Spring Boot, WebSocket, and vanilla JavaScript for minimal footprint and maximum performance.

