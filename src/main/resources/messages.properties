# Public-page SEO and introductory content
seo.locale=en_US
seo.home.title=Free Planning Poker Online – Scrum Estimation Tool | RBS
seo.home.description=Free online Planning Poker for Scrum and Agile teams. Create a room, invite your team and estimate user stories in real time — no registration required.
seo.about.title=What Is Planning Poker? Free Scrum Poker Tool | RBS
seo.about.description=Learn how Planning Poker works and estimate user stories with a free real-time Scrum Poker tool. Fibonacci, T-Shirt sizes, spectator mode and more.
seo.imprint.title=Imprint | RBS' Planning Poker
seo.imprint.description=Legal notice and contact information for RBS' Planning Poker, the free online Planning Poker tool operated by Roland B. Seper.
seo.application.description=Free online Planning Poker tool for Scrum and Agile teams.
seo.home.heading=Free Online Planning Poker for Agile Teams
seo.home.intro=Planning Poker, also called Scrum Poker or Estimation Poker, helps Agile teams build a shared understanding when estimating user stories. Each person chooses an estimate independently before the team reveals its cards and discusses the differences. This free online tool brings that conversation into your browser, whether you work together in one office or join from different locations. Use it during Sprint Planning or Backlog Refinement to explore effort, uncertainty and the assumptions behind a story.
seo.home.free.heading=Free & no registration
seo.home.free.text=Enter your display name and a room code in the form above, then share the room link with your team. No registration required: participants can join without creating an account or installing an app. Agree on the story you want to discuss and start a round. A room gives everyone the same place to vote, while the conversation can happen in your usual meeting or voice call.
seo.home.realtime.heading=Real-time Scrum estimation
seo.home.realtime.text=Real-time estimation keeps the group in sync as people join and submit their cards. Reveal the estimates together, ask why they differ and give everyone a chance to explain their reasoning. If the discussion uncovers missing information, clarify the user story and estimate again. Spectator mode lets a facilitator or observer follow along without voting. The aim is a useful team discussion and a shared estimate, rather than treating the average as an automatic decision.
seo.home.decks.heading=Multiple estimation decks
seo.home.decks.text=Choose Fibonacci for relative story points, T-Shirt sizes for a broader first assessment, or another available deck that fits your team. Keep the scale consistent within a session and compare new work with stories you already understand. Larger differences between cards can highlight uncertainty worth discussing before a sprint begins. Planning Poker supports your existing Scrum process; your team still decides what an estimate means and when a story is ready.

