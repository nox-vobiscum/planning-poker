# Raumleitfaden
manual.title=Anleitung & Funktionen
manual.join.title=Beitreten und einladen
manual.join.body=Über den Link-Button neben dem Raumcode kopierst du eine Einladung. Alle treten mit ihrem eigenen Anzeigenamen bei. Stimmen und Änderungen werden automatisch mit den anderen Teilnehmenden synchronisiert.
manual.vote.title=Schätzen und aufdecken
manual.vote.select=Wähle eine Karte für deine Schätzung. Du kannst deine Auswahl ändern, solange die Stimmen noch nicht aufgedeckt wurden.
manual.vote.hidden=Die anderen sehen zunächst nur, ob du bereits abgestimmt hast – nicht, welche Karte du gewählt hast.
manual.vote.reveal=Der Host deckt die Stimmen auf. Nach der Diskussion startet ihr bei Bedarf eine neue Runde.
manual.results.title=Abstimmungsstatus und Ergebnisse
manual.results.status=Die Symbole in der Teilnehmerliste zeigen, ob jemand bereits abgestimmt hat, noch keine Karte gewählt hat, zuschaut oder inaktiv ist.
manual.results.intro=Nach dem Aufdecken werden die gewählten Karten sichtbar. Bei unterschiedlichen numerischen Schätzungen zeigt Planning Poker:
manual.results.average=Durchschnitt: den arithmetischen Mittelwert der numerischen Schätzungen.
manual.results.median=Median: den mittleren Wert der sortierten numerischen Schätzungen.
manual.results.range=Spanne: die niedrigste und höchste numerische Schätzung.
manual.results.outlier=Ein zusätzlicher dezenter Rahmen kann Schätzungen markieren, die am stärksten vom Durchschnitt abweichen. Die Markierung hilft, unterschiedliche Sichtweisen zu erkennen, und bedeutet nicht, dass eine Schätzung falsch ist.
manual.results.consensus=Planning Poker zeigt Konsens an, wenn mindestens eine numerische Schätzung vorliegt, alle numerischen Schätzungen gleich sind und keine Unendlich-Karte gespielt wurde. Andere Spezialkarten werden bei diesem Vergleich nicht berücksichtigt.
manual.cards.title=Kartensätze und Spezialkarten
manual.cards.control=Der Host wählt die Kartensequenz und kann zusätzliche Spezialkarten aktivieren.
manual.cards.meaning=Je nach Einstellung stehen Karten für offene Fragen, Pausen, Abhängigkeiten, Risiken oder weiteren Diskussionsbedarf zur Verfügung.
manual.cards.statistics=Spezialkarten sind keine numerischen Schätzungen und werden bei Durchschnitt, Median und Spanne nicht berücksichtigt.
manual.roles.title=Rollen und Teilnahme
manual.roles.host=Der Host steuert das Aufdecken, neue Runden und die Raumeinstellungen. Über die Teilnehmeraktionen kann er die Host-Rolle übertragen, eine Person in den Zuschauermodus versetzen oder aus dem Raum entfernen.
manual.roles.spectator=Zuschauende können die Schätzung verfolgen, ohne selbst abzustimmen. Im eigenen Menü können sie die Teilnahme wieder aktivieren; auch der Host kann ihren Zuschauerstatus ändern.
manual.topic.title=Thema und automatisches Aufdecken
manual.topic.body=Der Host kann ein aktuelles Schätzthema mit Titel und optionalem Ticket-Link anzeigen. So ist für alle erkennbar, welche Aufgabe gerade geschätzt wird.
manual.topic.autoreveal=Ist das automatische Aufdecken aktiviert, werden die Karten aufgedeckt, sobald alle aktiven Mitschätzenden eine numerische Karte gewählt haben. Zuschauende und Inaktive werden nicht berücksichtigt; eine Spezialkarte löst das automatische Aufdecken nicht aus.
manual.appearance.title=Sprache und Darstellung
manual.appearance.location=Sprache und Darstellung kannst du jederzeit ändern. Auf größeren Bildschirmen findest du die Schalter im Header, auf Smartphones im Menü.
manual.appearance.options=Zur Auswahl stehen Deutsch und Englisch sowie Hell, Dunkel und System.
manual.exit.title=Raum verlassen oder schließen
manual.exit.leave=Mit „Raum verlassen“ scheidest nur du aus der Sitzung aus. Die anderen können weitermachen.
manual.exit.close=Der Host kann den Raum über die separate Funktion „Raum für alle schließen“ für sämtliche Teilnehmenden beenden.

# === About Page ===
about.title=Über RBS' Planning Poker
about.heading=Kostenloses Online Planning Poker für agile Teams
about.intro=RBS' Planning Poker ist ein kostenloses, schlankes Online Planning Poker Tool für agile Teams. Keine Registrierung erforderlich, einfach einen Raum erstellen und mit dem Schätzen beginnen.

about.what.title=Was ist Planning Poker?
about.what.p1=Planning Poker (auch bekannt als Scrum Poker oder Estimation Poker) ist eine Methode, mit der Teams den Aufwand oder die relative Größe von Aufgaben gemeinsam einschätzen. Alle Beteiligten wählen ihre Schätzung zunächst verdeckt; anschließend werden die Karten gleichzeitig aufgedeckt.
about.what.p2=So wird der unmittelbare Einfluss der zuerst genannten Zahl auf die Einschätzungen der anderen reduziert. Unterschiedliche Schätzungen machen verschiedene Sichtweisen sichtbar und liefern wertvolle Anlässe für eine gemeinsame Diskussion. Ziel ist nicht, möglichst schnell eine Zahl zu finden, sondern ein gemeinsames Verständnis der Aufgabe zu entwickeln.

about.why.title=Warum dieses Tool verwenden?
about.why.realtime=Echtzeit-Synchronisation zwischen allen Teilnehmenden
about.why.noreg=Keine Registrierung oder Anmeldung erforderlich
about.why.sequences=Mehrere Kartensequenzen (Fibonacci, T-Shirt-Größen, Zweierpotenzen)
about.why.autoreveal=Manuelles oder automatisches Aufdecken
