# Public-page SEO and introductory content
seo.locale=de_DE
seo.home.title=Kostenloses Planning Poker online – Scrum-Schätztool | RBS
seo.home.description=Kostenloses Online Planning Poker für Scrum- und agile Teams. Raum erstellen, Team einladen und User Stories in Echtzeit schätzen – ohne Registrierung.
seo.about.title=Was ist Planning Poker? Kostenloses Scrum Poker | RBS
seo.about.description=So funktioniert Planning Poker: User Stories mit einem kostenlosen Scrum-Poker-Tool in Echtzeit schätzen. Fibonacci, T-Shirt-Größen, Zuschauermodus und mehr.
seo.imprint.title=Impressum | RBS' Planning Poker
seo.imprint.description=Impressum und Kontaktinformationen für RBS' Planning Poker, das kostenlose Online-Planning-Poker-Tool von Roland B. Seper.
seo.application.description=Kostenloses Online-Planning-Poker-Tool für Scrum- und agile Teams.
seo.home.heading=Kostenloses Online Planning Poker für agile Teams
seo.home.intro=Planning Poker, auch Scrum Poker oder Estimation Poker genannt, hilft agilen Teams, beim Schätzen von User Stories ein gemeinsames Verständnis zu entwickeln. Alle wählen ihre Schätzung zunächst unabhängig voneinander. Danach deckt das Team die Karten auf und bespricht Unterschiede. Dieses kostenlose Online-Tool bringt die gemeinsame Schätzrunde in den Browser – im Büro genauso wie im verteilten Team. Nutzt es im Sprint Planning oder Backlog Refinement, um Aufwand, Unsicherheiten und Annahmen hinter einer User Story gemeinsam zu klären.
seo.home.free.heading=Kostenlos und ohne Registrierung
seo.home.free.text=Trage oben deinen Anzeigenamen und einen Raumcode ein und teile anschließend den Raumlink mit deinem Team. Eine Registrierung ist nicht erforderlich: Alle können ohne Benutzerkonto und ohne Installation einer App teilnehmen. Einigt euch auf die nächste User Story und beginnt eine Runde. Der Raum bietet einen gemeinsamen Ort für die Abstimmung, während ihr das Gespräch wie gewohnt im Meeting oder in eurem Sprachanruf führt. Auch spontan eingeladene Kolleginnen und Kollegen können so direkt mitmachen.
seo.home.realtime.heading=Scrum-Schätzungen in Echtzeit
seo.home.realtime.text=Die Echtzeit-Schätzung hält die Gruppe auf dem gleichen Stand, wenn Personen beitreten und ihre Karten wählen. Deckt die Schätzungen gemeinsam auf und besprecht, warum sie voneinander abweichen. Gebt allen die Gelegenheit, ihre Überlegungen zu erklären. Werden dabei fehlende Informationen sichtbar, klärt die User Story und schätzt erneut. Im Zuschauermodus können Moderierende oder Gäste die Runde verfolgen, ohne abzustimmen. Ziel sind ein hilfreiches Gespräch und eine gemeinsame Einschätzung; der Durchschnitt ersetzt keine Entscheidung des Teams.
seo.home.decks.heading=Verschiedene Schätzkarten
seo.home.decks.text=Wählt Fibonacci für relative Story Points, T-Shirt-Größen für eine erste grobe Einschätzung oder eine andere verfügbare Kartenfolge, die zu eurem Team passt. Bleibt innerhalb einer Sitzung bei einer einheitlichen Skala und vergleicht neue Aufgaben mit bereits bekannten User Stories. Größere Abstände zwischen den Karten können auf Unsicherheit hinweisen, die ihr vor dem Sprint besprechen solltet. Planning Poker unterstützt euren bestehenden Scrum-Prozess. Was eine Schätzung bedeutet und wann eine Story bereit ist, entscheidet weiterhin das Team.

