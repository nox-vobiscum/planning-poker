<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}" lang="en">
<head th:replace="~{fragments/head :: head(page='home')}"></head>
<body class="page-landing">

  <!-- App menu (index: no seq/room controls) -->
  <div th:replace="~{fragments/app-header :: appHeader}"></div>
  <div th:replace="~{fragments/room-return :: roomReturn}"></div>
  <div th:replace="~{fragments/menu :: appMenu(showSeq=${false}, showAuto=${false}, showRoom=${false})}"></div>
  <th:block th:replace="~{fragments/app-header :: headerScripts}"></th:block>

  <main>
  <div class="container home-container">
    <!-- Join form (posts to /join like invite.html) -->
    <form id="joinForm" class="join-form" th:action="@{/join}" method="post" novalidate>
      <div class="form-row">
        <label for="nameInput">
          <span class="mi-icon" aria-hidden="true"><svg class="pp-status-icon"><use href="#pp-icon-person"/></svg></span>
          <span th:text="#{label.yourName}" data-i18n="label.yourName">Your name</span>
        </label>
        <input id="nameInput" name="participantName" type="text" maxlength="40" autocomplete="name" required placeholder="Jane Doe">
      </div>
      <div class="form-row">
        <label for="roomInput">
          <span class="mi-icon" aria-hidden="true"><svg class="pp-status-icon"><use href="#pp-icon-room"/></svg></span>
          <span th:text="#{label.roomCode}" data-i18n="label.roomCode">Room code</span>
        </label>
        <input id="roomInput" name="roomCode" type="text" maxlength="40" autocapitalize="none" spellcheck="false" required placeholder="team-alpha">
      </div>

      <!-- Hidden flags (default false); parity with /invite -->
      <input type="hidden" name="persistent" value="false">
      <input type="hidden" name="testRoom" value="false">

      <div class="form-actions">
        <button class="button" type="submit"
                th:text="#{button.join}"
                data-i18n="button.join"
                th:attr="title=#{button.join},aria-label=#{button.join}"
                data-i18n-attr="title:button.join;aria-label:button.join">Join</button>
      </div>
    </form>

    <!-- CTA for new users -->
    <p class="landing-cta">
      <span th:text="#{landing.newhere}" data-i18n="landing.newhere">New to Planning Poker?</span>
      <a th:href="@{/about}" th:text="#{landing.learnmore}" data-i18n="landing.learnmore">Learn more about how it works</a>
    </p>
  </div>

  <section class="container landing-explainer" aria-labelledby="planning-poker-heading">
    <h1 id="planning-poker-heading" th:text="#{seo.home.heading}" data-i18n="seo.home.heading">Free Online Planning Poker for Agile Teams</h1>
    <p th:text="#{seo.home.intro}" data-i18n="seo.home.intro"></p>
    <h2 th:text="#{seo.home.free.heading}" data-i18n="seo.home.free.heading">Free &amp; no registration</h2>
    <p th:text="#{seo.home.free.text}" data-i18n="seo.home.free.text"></p>
    <h2 th:text="#{seo.home.realtime.heading}" data-i18n="seo.home.realtime.heading">Real-time Scrum estimation</h2>
    <p th:text="#{seo.home.realtime.text}" data-i18n="seo.home.realtime.text"></p>
    <h2 th:text="#{seo.home.decks.heading}" data-i18n="seo.home.decks.heading">Multiple estimation decks</h2>
    <p th:text="#{seo.home.decks.text}" data-i18n="seo.home.decks.text"></p>
  </section>
  </main>

  <script src="/js/identity.js?v=2"></script>
  <script>
  (function(){
    const form  = document.getElementById('joinForm');
    const nameI = document.getElementById('nameInput');
    const roomI = document.getElementById('roomInput');

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const n = window.PPStorage.read('localStorage', 'pp-name');
        const r = window.PPStorage.read('localStorage', 'pp-room');
        if (n && !nameI.value) nameI.value = n;
        if (r && !roomI.value) roomI.value = r;
        if (!nameI.value) nameI.focus();
        else if (!roomI.value) roomI.focus();
        else document.querySelector('.button')?.focus();
      } catch {}
    });

    let checkGeneration = 0;
    form.addEventListener('input', () => { checkGeneration++; });
    form.addEventListener('submit', async (e) => {
      const generation = ++checkGeneration;
      const current = () => generation === checkGeneration &&
        nameI.value.trim() === n && roomI.value.trim() === r;
      e.preventDefault(); // manual submit after checks

      const n = (nameI.value || '').trim();
      const r = (roomI.value || '').trim();

      if (!n || !r) {
        alert('Please enter your name and a room code.');
        (!n ? nameI : roomI).focus();
        return;
      }

      try {
        localStorage.setItem('pp-name', n);
        localStorage.setItem('pp-room', r);
      } catch {}

      // A stored proof is only a resume candidate; the WebSocket authenticates it.
      if (window.PPIdentity.read(r)) { form.submit(); return; }

      // Advisory name check for a new participation.
      try {
        const url = `/api/rooms/${encodeURIComponent(r)}/name-taken?name=${encodeURIComponent(n)}`;
        const res = await fetch(url, { headers: { 'Accept': 'application/json' }, cache: 'no-store' });
        if (res.ok) {
          const taken = await res.json(); // boolean
          if (!current()) return;
          if (window.PPIdentity.read(r)) { form.submit(); return; }
          if (taken === true) {
            alert('This name is already used in this room. Please choose a unique display name.');
            nameI.focus();
            return;
          }
        }
      } catch {}

      if (current()) form.submit();
    });
  })();
  </script>

  <script defer src="/js/index-flash.js?v=2"></script>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
